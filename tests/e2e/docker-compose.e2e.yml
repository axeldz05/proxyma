networks:
  proxyma-net:
    driver: bridge

services:
  node-1:
    image: proxyma-e2e-node-1
    build:
      context: ../..
      dockerfile: Dockerfile
    user: "${HOST_UID}:${HOST_GID}"
    networks:
      - proxyma-net
    volumes:
      - "${E2E_DATA_DIR}/node-1:/app/data"

  node-2:
    image: proxyma-e2e-node-2
    build:
      context: ../..
      dockerfile: Dockerfile
    user: "${HOST_UID}:${HOST_GID}"
    networks:
      - proxyma-net
    volumes:
      - "${E2E_DATA_DIR}/node-2:/app/data"

  node-3:
    image: proxyma-e2e-node-3
    build:
      context: ../..
      dockerfile: Dockerfile
    user: "${HOST_UID}:${HOST_GID}"
    networks:
      - proxyma-net
    volumes:
      - "${E2E_DATA_DIR}/node-3:/app/data"

  node-low-spec:
    image: proxyma-e2e-node-2
    build:
      context: ../..
      dockerfile: Dockerfile
    user: "${HOST_UID}:${HOST_GID}"
    networks:
      - proxyma-net
    volumes:
      - "${E2E_DATA_DIR}/node-2:/app/data"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
