name: Proxyma CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
jobs:
  build-and-test:
    name: Lint, Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Fyne system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Run integration contract tests
        run: make test-integration

      - name: Run Go test suite
        run: make test

      - name: Run race detector
        run: make test-race

      - name: Record Go coverage
        run: |
          go test -count=1 -coverprofile=coverage-unit.out ./...
          go tool cover -func=coverage-unit.out | tee coverage-summary.txt
          {
            echo '### Go statement coverage'
            echo '```text'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Go coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: |
            coverage-unit.out
            coverage-summary.txt
          if-no-files-found: ignore
          retention-days: 5

      - name: Build Binary
        run: make build

      - name: Smoke Test Binary
        run: ./proxyma --help

  android:
    name: Android Bind, Test, Lint and Assemble
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          gradle_ndk=26.1.10909125
          gomobile_ndk=27.0.12077973
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${gradle_ndk}" \
            "ndk;${gomobile_ndk}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${gomobile_ndk}" >> "${GITHUB_ENV}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Resolve module-pinned gomobile
        run: go tool gomobile help >/dev/null

      - name: Run Android integration checks
        run: make test-android
