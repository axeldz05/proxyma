name: Proxyma E2E Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-cluster-test:
    name: Run Distributed E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable' 
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Make scripts executable
        run: chmod +x ./tests/e2e/run.sh ./tests/e2e/cases/*.sh

      - name: Execute E2E Test Suite
        run: ./tests/e2e/run.sh

      - name: Upload E2E Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: tests/e2e/logs/
          retention-days: 5
